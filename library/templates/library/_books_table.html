<table class="books">
  <thead>
    <tr>
      <th scope="col">Título</th>
      <th scope="col">Autor</th>
      <th scope="col">Categoría</th>
      <th scope="col" class="num">Ejemplares</th>
    </tr>
  </thead>
  <tbody>
    {% for book in books %}
    <tr>
      <td class="book-title">{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td><span class="badge">{{ book.category }}</span></td>
      <td class="num">{{ book.copies }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
